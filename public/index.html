<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="HOBA online store prototype: skincare, hair, bath and body, fragrance and more, delivered across Kenya.">
<link rel="icon" type="image/png" href="content/asset2.png">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>HOBA — House of Beauty Africa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: Ulta-style commerce chrome (utility bar, logo+search bar, mega-nav) over a 1280px content column; HOBA plum + gold identity, Jost UI face, Playfair for hero display lines. */
:root{
  --plum:#660032; --plum-deep:#4b0025; --plum-soft:#f4e6ec; --gold:#ceaa78; --gold-deep:#a9875a; --gold-soft:#f6efe3;
  --bg:#ffffff; --surface:#f8f4f5; --surface-2:#f1e9ec; --line:#e6dbe0; --ink:#1d1419; --muted:#6c5a63; --on-plum:#ffffff;
  --ok:#1f7a4d; --warn:#9a6a00; --bad:#b3261e; --shadow:0 8px 24px rgba(74,0,37,.10);
  --font-ui:"Jost",system-ui,"Segoe UI",Helvetica,Arial,sans-serif; --font-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --radius:4px; --max:1280px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --plum:#c6628f; --plum-deep:#8f2a5c; --plum-soft:#2c1a24; --gold:#d8b98a; --gold-deep:#e4cba3; --gold-soft:#2a2320; --bg:#151015; --surface:#1e171c; --surface-2:#281f25; --line:#3a2d34; --ink:#f3ecef; --muted:#b3a3ab; --on-plum:#ffffff; --ok:#6ccf95; --warn:#e3b64a; --bad:#ff7b72; --shadow:0 8px 24px rgba(0,0,0,.45); color-scheme:dark } }
:root[data-theme="dark"]{ --plum:#c6628f; --plum-deep:#8f2a5c; --plum-soft:#2c1a24; --gold:#d8b98a; --gold-deep:#e4cba3; --gold-soft:#2a2320; --bg:#151015; --surface:#1e171c; --surface-2:#281f25; --line:#3a2d34; --ink:#f3ecef; --muted:#b3a3ab; --on-plum:#ffffff; --ok:#6ccf95; --warn:#e3b64a; --bad:#ff7b72; --shadow:0 8px 24px rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--plum-deep)}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:500;line-height:1.2;text-wrap:balance}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
.wrap{max-width:var(--max);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;font-weight:500;font-size:14px;letter-spacing:.02em;transition:background .15s,color .15s,border-color .15s;border:1.5px solid transparent;white-space:nowrap}
.btn-primary{background:var(--plum-deep);color:var(--on-plum)}
.btn-primary:hover{background:var(--plum)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-outline{border-color:var(--ink);color:var(--ink)}
.btn-outline:hover{background:var(--ink);color:var(--bg)}
.btn-light{background:var(--bg);color:var(--ink)}
.btn-light:hover{background:var(--surface-2)}
.btn-sm{min-height:36px;padding:0 16px;font-size:13px}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--plum)}
.price{font-variant-numeric:tabular-nums;font-weight:500}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);font-size:12px;font-weight:500}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:3px;background:var(--plum-soft);color:var(--plum)}
.tag.gold{background:var(--gold-soft);color:var(--gold-deep)}
.tag.ink{background:var(--ink);color:var(--bg)}
.tag.bad{background:#fde7e5;color:var(--bad)}
:root[data-theme="dark"] .tag.bad{background:#4a1f1b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.bad{background:#4a1f1b}}

/* ---------- header ---------- */
.proto{background:var(--ink);color:var(--bg);font-size:12px;text-align:center;padding:6px 16px}
.proto b{color:var(--gold)}
.util{background:var(--plum-deep);color:#fff;font-size:12.5px}
.util .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:34px}
.util ul{display:flex;gap:22px}
.util a:hover{text-decoration:underline}
.theme-btn{display:inline-flex;align-items:center;gap:6px;color:#fff;padding:3px 10px;border:1px solid rgba(255,255,255,.45);border-radius:999px;font-size:12px}
.theme-btn svg{width:14px;height:14px}
.theme-btn:hover{background:rgba(255,255,255,.12)}
.theme-ico{display:none}
@media (max-width:860px){.theme-ico{display:grid}}
.util .promo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.mainbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;min-height:76px}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:40px;width:auto}
.logo .plum{display:block}.logo .white{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo .plum{display:none}:root:not([data-theme="light"]) .logo .white{display:block}}
:root[data-theme="dark"] .logo .plum{display:none}:root[data-theme="dark"] .logo .white{display:block}
.search{position:relative;max-width:620px;width:100%;justify-self:center}
.search form{display:flex;align-items:center;border:1.5px solid var(--ink);border-radius:999px;height:44px;padding:0 6px 0 18px;background:var(--bg)}
.search input{flex:1;border:0;background:none;outline:none;font-size:15px;min-width:0}
.search input::placeholder{color:var(--muted)}
.search button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.search button:hover{background:var(--surface-2)}
.suggest{position:absolute;top:50px;left:0;right:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 0;display:none;z-index:70;max-height:70vh;overflow:auto}
.suggest.open{display:block}
.suggest .h{padding:6px 18px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.suggest a{display:flex;align-items:center;gap:12px;padding:8px 18px}
.suggest a:hover{background:var(--surface)}
.suggest img,.suggest .ph{width:40px;height:40px;border-radius:6px;object-fit:cover;background:var(--surface-2);flex:none}
.suggest .n{font-size:14px}.suggest .b{font-size:12px;color:var(--muted)}
.icons{display:flex;align-items:center;gap:6px}
.icon-btn{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.icon-btn .count{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--plum);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.icon-btn .lbl{display:none}
.burger{display:none}
nav.cats{border-top:1px solid var(--line)}
nav.cats ul{display:flex;gap:0;justify-content:space-between}
nav.cats li{position:relative}
nav.cats a.top{display:block;padding:12px 10px;font-size:14px;font-weight:500;letter-spacing:.01em;border-bottom:2px solid transparent;white-space:nowrap}
nav.cats li:hover a.top,nav.cats li.open a.top{border-bottom-color:var(--plum);color:var(--plum)}
nav.cats a.top.hi{color:var(--plum);font-weight:600}
.mega{position:absolute;left:0;top:100%;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:0 0 12px 12px;padding:22px 26px;display:none;z-index:55;min-width:560px;grid-template-columns:1fr 1fr 200px;gap:20px 36px}
nav.cats li:hover .mega,nav.cats li.open .mega{display:grid}
nav.cats li:nth-last-child(-n+3) .mega{left:auto;right:0}
.mega h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:600}
.mega a{display:block;padding:5px 0;font-size:14px}
.mega a:hover{color:var(--plum);text-decoration:underline;text-underline-offset:3px}
.mega a.all{font-weight:600;color:var(--plum);margin-top:6px}
.mega .feat{border-radius:10px;overflow:hidden;background:var(--surface)}
.mega .feat img{aspect-ratio:4/5;object-fit:cover}
.mega .feat span{display:block;padding:10px 12px;font-size:13px;font-weight:500}

/* drawer (mobile nav) */
.drawer{position:fixed;inset:0;z-index:80;display:none}
.drawer.open{display:block}
.drawer .veil{position:absolute;inset:0;background:rgba(20,10,16,.55)}
.drawer .panel{position:absolute;top:0;bottom:0;left:0;width:min(360px,88vw);background:var(--bg);overflow:auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 40px 16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.drawer .panel .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.drawer details{border-bottom:1px solid var(--line)}
.drawer summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-weight:500;cursor:pointer}
.drawer summary::-webkit-details-marker{display:none}
.drawer summary::after{content:"+";font-size:18px;color:var(--muted)}
.drawer details[open] summary::after{content:"–"}
.drawer details a{display:block;padding:8px 0 8px 12px;color:var(--muted)}
.drawer details a.all{color:var(--plum);font-weight:600}
.drawer .util-links{margin-top:18px;display:grid;gap:12px;color:var(--muted)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:16px;margin-top:20px}
.tile{position:relative;border-radius:14px;overflow:hidden;background:var(--surface);display:block;min-height:240px}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .cap{position:absolute;left:0;right:0;bottom:0;padding:22px;background:linear-gradient(180deg,rgba(40,0,20,0) 0%,rgba(40,0,20,.78) 100%);color:#fff}
.tile .cap .eyebrow{color:#f0dcc5}
.tile h3{font-size:22px;margin:6px 0 10px;color:#fff}
.tile .cap .btn{margin-top:4px}
.tile.big{min-height:420px;grid-row:span 2}
.tile.big h3{font-family:var(--font-display);font-weight:500;font-size:40px;line-height:1.05}
.tile.top .cap{top:0;bottom:auto;background:linear-gradient(0deg,rgba(40,0,20,0) 0%,rgba(40,0,20,.78) 100%)}
section.block{margin-top:52px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:18px}
.sec-head h2{font-size:24px;font-weight:500}
.sec-head .sub{color:var(--muted);font-size:13px}
.catgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:14px}
.catgrid a{text-align:center;font-size:13px;font-weight:500}
.catgrid .circ{aspect-ratio:1;border-radius:50%;background:var(--surface-2);overflow:hidden;margin-bottom:10px;border:2px solid transparent;transition:border-color .15s}
.catgrid a:hover .circ{border-color:var(--plum)}
.catgrid .circ img{width:100%;height:100%;object-fit:cover}
.catgrid .circ.ico{display:grid;place-items:center;color:var(--plum)}
.catgrid .circ.ico svg{width:38%;height:38%}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 3*16px)/4);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:thin}
.rail>*{scroll-snap-align:start}
.band{border-radius:16px;padding:28px;display:grid;grid-template-columns:260px 1fr;gap:28px;align-items:center;background:var(--plum-deep);color:#fff}
.band h2{font-family:var(--font-display);font-size:34px;font-weight:500;color:#fff}
.band p{color:#f0dcc5;margin:8px 0 16px}
.band .rail{grid-auto-columns:calc((100% - 3*14px)/4);gap:14px}
.band .card{background:var(--bg);color:var(--ink)}
.band .card .cb{color:var(--muted)}
.promo3{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.promo3 .tile{min-height:300px}
.store{display:grid;grid-template-columns:1fr 1.4fr;gap:0;border-radius:16px;overflow:hidden;background:var(--surface)}
.store .l{padding:34px;background:var(--gold-soft)}
.store .l h2{font-size:30px;font-family:var(--font-display);font-weight:500;margin-bottom:8px}
.store .l p{color:var(--muted);margin-bottom:18px;max-width:38ch}
.store .r{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line)}
.store .r div{background:var(--bg);padding:22px}
.store .r b{display:block;margin-bottom:4px;font-weight:600}
.store .r span{color:var(--muted);font-size:13.5px}
.brandstrip{display:flex;flex-wrap:wrap;gap:10px}
.brandstrip a{padding:10px 16px;border:1px solid var(--line);border-radius:999px;font-size:14px;font-weight:500}
.brandstrip a:hover{border-color:var(--plum);color:var(--plum)}
.news{margin-top:60px;background:var(--surface);border-top:1px solid var(--line)}
.news .wrap{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;padding-block:34px}
.news h2{font-size:24px}
.news p{color:var(--muted)}
.news form{display:flex;gap:10px}
.news input{flex:1;height:46px;border:1.5px solid var(--ink);border-radius:999px;padding:0 18px;background:var(--bg);min-width:0}
.news .done{color:var(--ok);font-weight:500}

/* ---------- product card ---------- */
.card{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s,border-color .15s;min-width:0}
.card:hover{box-shadow:var(--shadow);border-color:transparent}
.card .im{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface)}
.card .im img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.pic{width:100%;height:100%;background-repeat:no-repeat;background-color:#fff;mix-blend-mode:multiply}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pic{mix-blend-mode:normal;border-radius:inherit}}
:root[data-theme="dark"] .pic{mix-blend-mode:normal;border-radius:inherit}
.suggest .ph{overflow:hidden;display:block}
.thumbs button .pic{border-radius:6px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card .im img{mix-blend-mode:normal;background:#fff}}
:root[data-theme="dark"] .card .im img{mix-blend-mode:normal;background:#fff}
.card .badges{position:absolute;top:8px;left:8px;display:flex;flex-direction:column;gap:4px;z-index:2}
.card .wish{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.card .wish svg{width:18px;height:18px}
.card .wish.on svg{fill:var(--plum);stroke:var(--plum)}
.card .cb{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card .cn{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.card .cn a:hover{text-decoration:underline;text-underline-offset:3px}
.card .cp{display:flex;align-items:center;gap:8px}
.card .cp .price{font-size:15px}
.card .meta{font-size:12px;color:var(--muted)}
.card .meta.ok{color:var(--ok)}
.card .add{margin-top:auto}
.card .add .btn{min-height:38px;font-size:13px}

/* ---------- PLP ---------- */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--muted);margin:14px 0 10px}
.crumbs a:hover{color:var(--plum);text-decoration:underline}
.plp-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:8px}
.plp-head h1{font-size:28px;font-weight:500}
.plp-head .cnt{color:var(--muted);font-size:13px}
.subnav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 20px}
.subnav a{padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;background:var(--bg)}
.subnav a.on,.subnav a:hover{border-color:var(--plum);color:var(--plum);background:var(--plum-soft)}
.plp{display:grid;grid-template-columns:250px 1fr;gap:34px;align-items:start}
.filters{position:sticky;top:150px}
.filters details{border-bottom:1px solid var(--line);padding:4px 0}
.filters summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-weight:600;font-size:14px;cursor:pointer}
.filters summary::-webkit-details-marker{display:none}
.filters summary::after{content:"";width:8px;height:8px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg);transition:transform .15s}
.filters details[open] summary::after{transform:rotate(-135deg)}
.filters label{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px;cursor:pointer}
.filters label span.c{color:var(--muted);font-size:12px;margin-left:auto}
.filters input[type=checkbox]{width:17px;height:17px;accent-color:var(--plum-deep)}
.filters .list{max-height:260px;overflow:auto;padding-bottom:8px}
.filters .fsearch{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg);margin:4px 0 8px}
.filters .clear{margin-top:14px;font-size:13px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.applied{display:flex;flex-wrap:wrap;gap:6px}
.applied .chip button{font-size:14px;line-height:1;color:var(--muted)}
.sort{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-left:auto}
.sort select{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg)}
.filter-toggle{display:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.empty{padding:50px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.more{display:flex;justify-content:center;margin-top:26px}

/* ---------- PDP ---------- */
.pdp{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;margin-top:10px}
.gallery{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:start}
.thumbs{display:grid;gap:8px}
.thumbs button{aspect-ratio:1;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.thumbs button.on{border-color:var(--plum)}
.thumbs img{width:100%;height:100%;object-fit:contain;background:#fff}
.main-im{aspect-ratio:1;border-radius:14px;background:var(--surface);overflow:hidden;position:relative}
.main-im img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .main-im img{mix-blend-mode:normal;background:#fff}}
:root[data-theme="dark"] .main-im img{mix-blend-mode:normal;background:#fff}
.buy .brand{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.buy .brand a:hover{color:var(--plum)}
.buy h1{font-size:26px;font-weight:500;margin:6px 0 10px}
.stars{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.stars svg{width:16px;height:16px;fill:none;stroke:var(--gold-deep);stroke-width:1.5}
.buy .bigprice{font-size:26px;margin:18px 0 4px}
.buy .vat{font-size:12.5px;color:var(--muted)}
.buy .size{margin:20px 0}
.buy .size .lbl{font-size:13px;color:var(--muted);margin-bottom:8px}
.sizes{display:flex;gap:8px;flex-wrap:wrap}
.sizes span{padding:9px 14px;border:1.5px solid var(--ink);border-radius:8px;font-size:13.5px;font-weight:500}
.qtyrow{display:flex;gap:12px;align-items:center;margin:18px 0}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--ink);border-radius:999px;height:46px}
.qty button{width:42px;height:100%;font-size:20px}
.qty output{min-width:34px;text-align:center;font-weight:500}
.qtyrow .btn{flex:1}
.delivery{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px;margin-top:8px}
.delivery div{display:flex;gap:12px;align-items:flex-start;font-size:13.5px}
.delivery svg{width:20px;height:20px;flex:none;color:var(--plum)}
.delivery b{font-weight:600}
.acc{margin-top:22px;border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-weight:600;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-size:20px;color:var(--muted);font-weight:300}
.acc details[open] summary::after{content:"–"}
.acc .body{padding:0 0 18px;color:var(--muted);font-size:14px;max-width:62ch;line-height:1.6}
.acc .body ul{list-style:disc;padding-left:18px;display:grid;gap:4px}

/* ---------- cart ---------- */
.cart{display:grid;grid-template-columns:1fr 360px;gap:40px;margin-top:10px;align-items:start}
.cart h1{font-size:28px;font-weight:500;margin-bottom:6px}
.line{display:grid;grid-template-columns:96px 1fr auto;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);align-items:center}
.line .im{width:96px;height:96px;border-radius:10px;background:var(--surface);overflow:hidden}
.line .im img{width:100%;height:100%;object-fit:contain;background:#fff}
.line .cb{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.line .cn{font-size:15px;margin:2px 0 8px}
.line .ctrl{display:flex;align-items:center;gap:14px;font-size:13px}
.line .qty{height:36px}.line .qty button{width:34px;font-size:16px}
.line .rm{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.line .lp{text-align:right}
.summary{position:sticky;top:150px;border:1px solid var(--line);border-radius:14px;padding:22px;background:var(--surface)}
.summary h2{font-size:18px;margin-bottom:14px}
.summary .row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}
.summary .row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:14px;font-size:17px;font-weight:600}
.summary .promo{display:flex;gap:8px;margin:12px 0}
.summary .promo input{flex:1;height:42px;border:1px solid var(--line);border-radius:999px;padding:0 14px;background:var(--bg);min-width:0}
.summary .pay{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pay .pm{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:6px;font-size:11px;font-weight:700;display:grid;place-items:center;background:var(--bg);letter-spacing:.04em}
.pay .pm.mpesa{color:#1f8f3b;border-color:#1f8f3b}
.ship-bar{margin:14px 0 4px;font-size:13px}
.ship-bar .track{height:6px;background:var(--surface-2);border-radius:3px;margin-top:6px;overflow:hidden}
.ship-bar .track i{display:block;height:100%;background:var(--plum);border-radius:3px}
.checkout{display:grid;grid-template-columns:1fr 380px;gap:40px;margin-top:10px;align-items:start}
.form{display:grid;gap:14px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:12.5px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;background:var(--bg);width:100%}
.field textarea{height:auto;padding:12px 14px}
.field input:focus{border-color:var(--ink);outline:none}
.payopts{display:grid;gap:10px}
.payopts label{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.payopts label:has(input:checked){border-color:var(--plum)}
.payopts input{accent-color:var(--plum-deep)}
.payopts b{font-weight:600}.payopts span{color:var(--muted);font-size:13px;display:block}
.step{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:24px 0 10px}
.step:first-child{margin-top:0}
.done{padding:60px 20px;text-align:center;max-width:560px;margin:0 auto}
.done .ok-ico{width:72px;height:72px;border-radius:50%;background:var(--plum-soft);color:var(--plum);display:grid;place-items:center;margin:0 auto 18px}
.done h1{font-size:30px;margin-bottom:10px}
.done p{color:var(--muted);margin-bottom:22px}

/* ---------- account / content pages ---------- */
.narrow{max-width:760px;margin:0 auto}
.page-title{font-size:32px;font-weight:500;margin:22px 0 8px}
.page-sub{color:var(--muted);margin-bottom:26px;max-width:60ch}
.prose{max-width:68ch;font-size:15.5px;line-height:1.7}
.prose h2{font-size:21px;margin:30px 0 10px}
.prose h3{font-size:16px;margin:20px 0 6px;font-weight:600}
.prose p{margin-bottom:12px}
.prose ul{list-style:disc;padding-left:20px;display:grid;gap:6px;margin-bottom:12px}
.prose .note{background:var(--gold-soft);border-left:3px solid var(--gold-deep);padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;padding:16px 0;font-weight:600;cursor:pointer;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--muted);font-size:20px;font-weight:300}
.faq details[open] summary::after{content:"–"}
.faq .a{padding:0 0 18px;color:var(--muted);max-width:66ch;line-height:1.65}
.auth{display:grid;grid-template-columns:1fr 1fr;gap:32px;max-width:960px;margin:20px auto 0}
.auth .box{border:1px solid var(--line);border-radius:16px;padding:28px}
.auth h2{font-size:22px;margin-bottom:6px}
.auth p.lead{color:var(--muted);margin-bottom:18px;font-size:14px}
.perks{display:grid;gap:10px;margin:14px 0 20px}
.perks div{display:flex;gap:10px;align-items:center;font-size:14px}
.perks svg{width:18px;height:18px;color:var(--plum);flex:none}
.acct{display:grid;grid-template-columns:240px 1fr;gap:34px;margin-top:10px}
.acct nav a{display:block;padding:10px 12px;border-radius:8px}
.acct nav a.on{background:var(--plum-soft);color:var(--plum);font-weight:600}
.about-hero{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center;margin-top:24px}
.about-hero img{border-radius:16px;aspect-ratio:4/5;object-fit:cover}
.about-hero h1{font-family:var(--font-display);font-size:40px;font-weight:500;margin-bottom:14px}
.about-hero p{color:var(--muted);font-size:16px;line-height:1.7;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.stats div{background:var(--surface);border-radius:14px;padding:22px}
.stats b{display:block;font-size:26px;font-weight:500;margin-bottom:4px;font-family:var(--font-display)}
.stats span{color:var(--muted);font-size:13.5px}
.gift{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start;margin-top:20px}
.giftcard{aspect-ratio:1.6;border-radius:18px;background:linear-gradient(135deg,#4b0025,#7a1f4c 60%,#a4466f);color:#fff;padding:26px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.giftcard .wm{font-size:34px;letter-spacing:.3em;font-weight:500}
.giftcard small{letter-spacing:.2em;font-size:10px;display:block;opacity:.85}
.giftcard .amt{font-size:26px;font-family:var(--font-display)}
.amounts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 18px}
.amounts button{padding:10px 16px;border:1.5px solid var(--line);border-radius:10px;font-weight:500}
.amounts button.on{border-color:var(--plum);background:var(--plum-soft);color:var(--plum)}
.brands-az{columns:4;column-gap:30px;margin-top:10px}
.brands-az div{break-inside:avoid;margin-bottom:22px}
.brands-az h3{font-family:var(--font-display);font-size:24px;color:var(--plum);margin-bottom:6px}
.brands-az a{display:block;padding:4px 0;font-size:14.5px}
.brands-az a:hover{color:var(--plum);text-decoration:underline;text-underline-offset:3px}
.brands-az a span{color:var(--muted);font-size:12px;margin-left:6px}
.az-nav{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0 24px}
.az-nav a{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;font-size:13px}
.az-nav a:hover{border-color:var(--plum);color:var(--plum)}
.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}
.offer{border-radius:14px;padding:26px;background:var(--surface);display:grid;gap:8px;align-content:start;min-height:180px}
.offer.plum{background:var(--plum-deep);color:#fff}
.offer.plum .eyebrow{color:#f0dcc5}
.offer.gold{background:var(--gold-soft)}
.offer h3{font-size:22px}
.offer p{color:var(--muted);font-size:14px}
.offer.plum p{color:#f0dcc5}
.offer .btn{justify-self:start;margin-top:8px}
.track-box{max-width:520px;margin-top:20px;border:1px solid var(--line);border-radius:16px;padding:26px;display:grid;gap:14px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.steps div{text-align:center;font-size:12px;color:var(--muted)}
.steps i{display:block;height:6px;border-radius:3px;background:var(--surface-2);margin-bottom:8px}
.steps div.on i{background:var(--plum)}
.steps div.on{color:var(--ink);font-weight:600}

/* ---------- toast / footer ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast a{color:var(--gold);font-weight:600;white-space:nowrap}
footer.site{margin-top:0;border-top:1px solid var(--line);background:var(--bg)}
footer .cols{display:grid;grid-template-columns:repeat(5,1fr);gap:26px;padding-block:40px 30px}
footer h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px;font-weight:600}
footer .cols a{display:block;padding:5px 0;font-size:14px;color:var(--muted)}
footer .cols a:hover{color:var(--plum)}
footer .cols p{font-size:14px;color:var(--muted);padding:5px 0}
footer .social{display:flex;gap:10px;margin-top:10px}
footer .social a{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;padding:0}
footer .social svg{width:18px;height:18px}
footer .bottom{border-top:1px solid var(--line);padding-block:16px;display:flex;justify-content:space-between;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;align-items:center}
footer .bottom .pay{display:flex;gap:6px}
footer .wm{font-size:26px;letter-spacing:.32em;font-weight:500;color:var(--ink)}
footer .tagline{font-family:var(--font-display);font-style:italic;color:var(--muted);font-size:14px}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .catgrid{grid-template-columns:repeat(5,1fr)}
  .grid{grid-template-columns:repeat(3,1fr)}
  .rail{grid-auto-columns:calc((100% - 2*16px)/3)}
  .band{grid-template-columns:1fr}
  .band .rail{grid-auto-columns:calc((100% - 2*14px)/3)}
  .promo3{grid-template-columns:repeat(2,1fr)}
  footer .cols{grid-template-columns:repeat(3,1fr)}
  nav.cats a.top{padding:12px 6px;font-size:13px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .brands-az{columns:3}
}
@media (max-width:860px){
  .util ul{display:none}
  .mainbar{grid-template-columns:auto 1fr auto;gap:10px;min-height:64px}
  .burger{display:grid}
  .logo img{height:32px}
  .search{grid-column:1/-1;max-width:none;padding-bottom:10px}
  .search form{height:42px}
  nav.cats{display:none}
  .hero{grid-template-columns:1fr 1fr}
  .tile.big{grid-column:1/-1;grid-row:auto;min-height:360px}
  .tile.big h3{font-size:32px}
  .plp{grid-template-columns:1fr}
  .filters{display:none;position:static}
  .filters.open{display:block;border:1px solid var(--line);border-radius:12px;padding:0 16px 16px;margin-bottom:16px}
  .filter-toggle{display:inline-flex}
  .pdp{grid-template-columns:1fr;gap:26px}
  .gallery{grid-template-columns:1fr}
  .thumbs{grid-auto-flow:column;grid-auto-columns:64px;order:2}
  .cart,.checkout{grid-template-columns:1fr}
  .summary{position:static}
  .auth,.about-hero,.gift,.store,.news .wrap{grid-template-columns:1fr}
  .store .r{grid-template-columns:1fr 1fr}
  .acct{grid-template-columns:1fr}
  .acct nav{display:flex;gap:6px;overflow:auto}
  .offers{grid-template-columns:1fr}
  .brands-az{columns:2}
  .mega{display:none!important}
}
@media (max-width:560px){
  .catgrid{grid-template-columns:repeat(3,1fr);gap:10px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .rail{grid-auto-columns:calc((100% - 12px)/2);gap:12px}
  .band .rail{grid-auto-columns:calc((100% - 12px)/2)}
  .hero{grid-template-columns:1fr}
  .promo3{grid-template-columns:1fr}
  .store .r{grid-template-columns:1fr}
  .line{grid-template-columns:72px 1fr;gap:12px}
  .line .im{width:72px;height:72px}
  .line .lp{grid-column:2;text-align:left}
  footer .cols{grid-template-columns:1fr 1fr}
  .form .two{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .card{padding:8px}
  .card .cn{font-size:13px}
  .plp-head h1{font-size:22px}
  .buy h1{font-size:21px}
  .steps{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

</style>

function applyTheme(){ const r=document.documentElement; if(theme) r.setAttribute('data-theme',theme); else r.removeAttribute('data-theme'); }
function isDark(){ return theme ? theme==='dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
function toggleTheme(){ theme = isDark() ? 'light' : 'dark'; store.set('theme',theme); applyTheme(); render(); }

function pic(p, alt){ if(p.g){ const [sh,cx,cy]=p.g; const px=cx/(N_CELL-1)*100, py=cy/(N_CELL-1)*100; return `<div class="pic" role="img" aria-label="${esc(alt||p.n)}" style="background-image:url(sheets/s${sh}.webp);background-size:${N_CELL*100}% ${N_CELL*100}%;background-position:${px}% ${py}%"></div>`; } return `<img loading="lazy" src="${placeholder(p)}" alt="${esc(alt||p.n)}">`; }

  </article>`;
}
const cardsOf = list => list.map(card).join('');
function pick(filter, n){ return CATALOG.filter(filter).slice(0,n); }
function seeded(list, seed, n){ const a=list.slice(); let s=seed; for(let i=a.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a.slice(0,n); }

/* ---- router ---- */
let view = {name:'home', params:{}}; const history = [];
function nav(name, params={}){ go(name, params); return false; }
function go(name, params={}, replace=false){
  if(!replace) history.push(view);
  view = {name, params}; render(); window.scrollTo({top:0, behavior:'instant'});
  const token = ({home:'home',shop:params.cat||'shop',cart:'cart',account:'account',about:'about',faq:'faq',shipping:'shipping',policy:'policy',giftcard:'giftcard',brands:'brands',offers:'offers',new:'new',store:'store',track:'track',wishlist:'wishlist',contact:'contact'})[name];
  if(token){ try{ window.history.replaceState(null,'','#'+token); }catch(e){} }
  closeDrawer();
}
function back(){ const v=history.pop(); if(v){ view=v; render(); } else go('home'); }

function matches(p, q){ const s=(p.n+' '+p.b+' '+p.c+' '+p.s).toLowerCase(); return q.split(/\s+/).every(w=>s.includes(w)); }
function suggest(q){ const box=document.getElementById('suggest'); q=q.trim().toLowerCase(); if(q.length<2){ box.classList.remove('open'); return; }
  const prods = CATALOG.filter(p=>matches(p,q)).slice(0,6); const cats = CATS.filter(c=>c.name.toLowerCase().includes(q) || c.subs.some(s=>s.toLowerCase().includes(q))).slice(0,3);
  const brands = [...new Set(CATALOG.map(p=>p.b))].filter(b=>b.toLowerCase().includes(q)).slice(0,4);
  if(!prods.length && !cats.length && !brands.length){ box.innerHTML=`<div class="h">No matches for “${esc(q)}”</div>`; box.classList.add('open'); return; }
  box.innerHTML = (brands.length?`<div class="h">Brands</div>${brands.map(b=>`<a href="#" onclick="closeSuggest();return nav('brand',{b:${jq(b)} })"><span class="n">${esc(b)}</span></a>`).join('')}`:'')
   + (cats.length?`<div class="h">Categories</div>${cats.map(c=>`<a href="#" onclick="closeSuggest();return nav('shop',{cat:'${c.id}'})"><span class="n">${esc(c.name)}</span></a>`).join('')}`:'')
   + (prods.length?`<div class="h">Products</div>${prods.map(p=>`<a href="#" onclick="closeSuggest();return nav('product',{id:'${p.i}'})"><span class="ph">${pic(p,'')}</span><span><span class="n">${esc(p.n)}</span><br><span class="b">${esc(p.b)} · ${fmt(p.p)}</span></span></a>`).join('')}<a href="#" onclick="closeSuggest();return nav('search',{q:${jq(q)} })"><span class="n link">See all results for “${esc(q)}”</span></a>`:'');
  box.classList.add('open');
}
function closeSuggest(){ const b=document.getElementById('suggest'); if(b) b.classList.remove('open'); }
function doSearch(e){ e.preventDefault(); const q=document.getElementById('q').value.trim(); closeSuggest(); if(q) go('search',{q}); return false; }
document.addEventListener('click', e=>{ if(!e.target.closest('.search')) closeSuggest(); });

/* PLP */
let plpState = {brands:[], price:[], avail:false, sort:'featured', shown:24, fq:''};
function listFor(v){
  const p=v.params;
  if(v.name==='search'){ const q=(p.q||'').toLowerCase(); if(q==='under 500') return CATALOG.filter(x=>x.p<=500&&x.c!=='Home & Household'); return CATALOG.filter(x=>matches(x,q)); }
  if(v.name==='brand') return CATALOG.filter(x=>x.b===p.b);
  if(v.name==='new') return CATALOG.filter(x=>x.src==='excel' && x.m);
  const c=catById(p.cat); if(!c) return [];
  return CATALOG.filter(x=>x.c===c.name && (!p.sub || x.s===p.sub));
}
function plp(v){
  const p=v.params; const c=p.cat?catById(p.cat):null; const base=listFor(v);
  const title = v.name==='search' ? `Results for “${esc(p.q)}”` : v.name==='brand' ? esc(p.b) : v.name==='new' ? 'New arrivals' : esc(p.sub||c.name);
  let list = base.filter(x=>(!plpState.brands.length||plpState.brands.includes(x.b)) && (!plpState.price.length||plpState.price.some(r=>inRange(x.p,r))) && (!plpState.avail||x.k!=='out'));
  const sorts={featured:(a,b)=>(b.t.length-a.t.length)||(b.m?1:0)-(a.m?1:0), 'price-asc':(a,b)=>a.p-b.p, 'price-desc':(a,b)=>b.p-a.p, name:(a,b)=>a.n.localeCompare(b.n), brand:(a,b)=>a.b.localeCompare(b.b)};
  list = list.slice().sort(sorts[plpState.sort]||sorts.featured);
  const brandCounts={}; base.forEach(x=>brandCounts[x.b]=(brandCounts[x.b]||0)+1);
  const brandList = Object.keys(brandCounts).sort().filter(b=>!plpState.fq||b.toLowerCase().includes(plpState.fq));
  const ranges=[['Under KSh 500',0,500],['KSh 500 – 1,000',500,1000],['KSh 1,000 – 2,000',1000,2000],['KSh 2,000 – 3,500',2000,3500],['KSh 3,500 +',3500,1e9]];
  const subCounts={}; if(c) base.forEach(x=>subCounts[x.s]=(subCounts[x.s]||0)+1);
  const applied=[...plpState.brands.map(b=>`<span class="chip">${esc(b)} <button aria-label="Remove" onclick="fBrand(${jq(b)})">×</button></span>`),...plpState.price.map(r=>`<span class="chip">${esc(r)} <button aria-label="Remove" onclick="fPrice(${jq(r)})">×</button></span>`),plpState.avail?`<span class="chip">In stock <button onclick="fAvail()">×</button></span>`:''].join('');
  const crumbs = `<div class="crumbs"><a href="#" onclick="return nav('home')">Home</a> › ${c?`<a href="#" onclick="return nav('shop',{cat:'${c.id}'})">${esc(c.name)}</a>${p.sub?' › <span>'+esc(p.sub)+'</span>':''}`:`<span>${title}</span>`}</div>`;
  const shown=list.slice(0,plpState.shown);
  return `<div class="wrap">${crumbs}
    <div class="plp-head"><h1>${title}</h1><span class="cnt">${list.length} ${list.length===1?'item':'items'}</span></div>
    ${c?`<div class="subnav"><a href="#" class="${!p.sub?'on':''}" onclick="return nav('shop',{cat:'${c.id}'})">All</a>${c.subs.filter(s=>subCounts[s]).map(s=>`<a href="#" class="${p.sub===s?'on':''}" onclick="return nav('shop',{cat:'${c.id}',sub:${jq(s)} })">${esc(s)} <small>(${subCounts[s]})</small></a>`).join('')}</div>`:''}
    <div class="plp">
      <aside class="filters" id="filters">
        <details open><summary>Brand</summary><input class="fsearch" id="fq" placeholder="Search brands" value="${esc(plpState.fq)}" oninput="plpState.fq=this.value.toLowerCase();rerender('fq')"><div class="list">${brandList.map(b=>`<label><input type="checkbox" ${plpState.brands.includes(b)?'checked':''} onchange="fBrand(${jq(b)})"> ${esc(b)} <span class="c">${brandCounts[b]}</span></label>`).join('')||'<p class="meta">No brands match.</p>'}</div></details>
        <details open><summary>Price</summary>${ranges.map(r=>`<label><input type="checkbox" ${plpState.price.includes(r[0])?'checked':''} onchange="fPrice(${jq(r[0])})"> ${r[0]} <span class="c">${base.filter(x=>x.p>=r[1]&&x.p<r[2]).length}</span></label>`).join('')}</details>
        <details open><summary>Availability</summary><label><input type="checkbox" ${plpState.avail?'checked':''} onchange="fAvail()"> In stock only</label></details>
        <button class="link clear" onclick="plpState={brands:[],price:[],avail:false,sort:plpState.sort,shown:24,fq:''};render()">Clear all filters</button>

function inRange(p,label){ const m={'Under KSh 500':[0,500],'KSh 500 – 1,000':[500,1000],'KSh 1,000 – 2,000':[1000,2000],'KSh 2,000 – 3,500':[2000,3500],'KSh 3,500 +':[3500,1e9]}[label]; return m&&p>=m[0]&&p<m[1]; }
function fBrand(b){ const i=plpState.brands.indexOf(b); i>=0?plpState.brands.splice(i,1):plpState.brands.push(b); plpState.shown=24; render(); }
function fPrice(r){ const i=plpState.price.indexOf(r); i>=0?plpState.price.splice(i,1):plpState.price.push(r); plpState.shown=24; render(); }

  const c=catByName(p.c); const related=seeded(CATALOG.filter(x=>x.c===p.c&&x.i!==id&&x.s===p.s),id.length,4).concat(seeded(CATALOG.filter(x=>x.c===p.c&&x.i!==id&&x.s!==p.s),id.length+1,4)).slice(0,4);
  const more=CATALOG.filter(x=>x.b===p.b&&x.i!==id).slice(0,4);
  const desc = p.d || `${p.n} by ${p.b}. Selected by HOBA from trusted brands in the UK, France, Korea and Australia, and stocked in our Kilimani store. Full product description, ingredients and how-to-use will be added from the supplier listing before launch.`;

  return `<div class="wrap"><div class="crumbs"><a href="#" onclick="return nav('home')">Home</a> › <a href="#" onclick="return nav('shop',{cat:'${c.id}'})">${esc(c.name)}</a> › <a href="#" onclick="return nav('shop',{cat:'${c.id}',sub:${jq(p.s)} })">${esc(p.s)}</a></div>
  <div class="pdp">
    <div class="gallery"><div class="thumbs"><button class="on" aria-label="Image 1">${pic(p,'')}</button></div><div class="main-im"><div class="badges" style="position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:2">${badges(p)}</div>${pic(p)}</div></div>
    <div class="buy">
      <div class="brand"><a href="#" onclick="return nav('brand',{b:${jq(p.b)} })">${esc(p.b)}</a></div>
      <h1>${esc(p.n)}</h1>
      <div class="stars">${I.star.repeat(5)}<span>No reviews yet · <a class="link" href="#" onclick="toast('Reviews open after launch');return false">Write the first review</a></span></div>
      <div class="bigprice price">${fmt(p.p)}</div><div class="vat">Excluding tax · ${p.p>=STORE.freeShip?'Free delivery':'Free delivery on orders over '+fmt(STORE.freeShip)}</div>
      ${size?`<div class="size"><div class="lbl">Size</div><div class="sizes"><span>${esc(size)}</span></div></div>`:''}
      <div class="qtyrow"><div class="qty"><button aria-label="Decrease" onclick="qtyStep(-1)">−</button><output id="pq">1</output><button aria-label="Increase" onclick="qtyStep(1)">+</button></div>${p.k==='out'?'<button class="btn btn-outline" disabled>Sold out — notify me</button>':`<button class="btn btn-primary" onclick="addToCart('${p.i}',+document.getElementById('pq').value)">Add to bag</button>`}<button class="icon-btn ${wish.includes(p.i)?'on':''}" data-wish="${p.i}" aria-label="Save to wishlist" onclick="toggleWish('${p.i}')" style="border:1.5px solid var(--line)">${I.heart}</button></div>
      <div class="delivery"><div>${I.truck}<span><b>Delivery</b> · Nairobi 1–2 business days, rest of Kenya 2–4 days. Order by 2pm for same-day dispatch.</span></div><div>${I.shop}<span><b>Click &amp; collect</b> · ${p.k==='out'?'Not available':'Ready today'} at ${STORE.name}, 1st Floor, Suite 124.</span></div><div>${I.check}<span><b>14-day returns</b> · Unopened products, no questions asked.</span></div></div>
      <div class="acc">
        <details open><summary>Details</summary><div class="body"><p>${esc(desc)}</p></div></details>
        <details><summary>How to use</summary><div class="body"><p>Use as directed on the pack. For skincare, apply to clean skin morning and night; for body care, massage into damp skin after showering.</p></div></details>
        <details><summary>Ingredients</summary><div class="body"><p>Full ingredient list will be pulled from the supplier barcode (${p.q!=null?'in the HOB list':'on file'}) before launch.</p></div></details>
        <details><summary>Delivery &amp; returns</summary><div class="body"><ul><li>Kenya tracked delivery, 1–2 business days (Nairobi).</li><li>Free for all orders over ${fmt(STORE.freeShip)}.</li><li>14-day no-quibble returns on unopened products.</li><li>We ship within East Africa: Kenya, Tanzania, Uganda and Rwanda.</li></ul></div></details>
      </div>
    </div>
  </div>
  ${related.length?`<section class="block"><div class="sec-head"><h2>You may also like</h2><a class="link sub" href="#" onclick="return nav('shop',{cat:'${c.id}',sub:${jq(p.s)} })">More ${esc(p.s)}</a></div><div class="rail">${cardsOf(related)}</div></section>`:''}
  ${more.length?`<section class="block"><div class="sec-head"><h2>More from ${esc(p.b)}</h2><a class="link sub" href="#" onclick="return nav('brand',{b:${jq(p.b)} })">All ${esc(p.b)}</a></div><div class="rail">${cardsOf(more)}</div></section>`:''}

function qtyStep(d){ const o=document.getElementById('pq'); o.value=Math.max(1,(+o.value)+d); }

  </div></div>`;
}

function offers(){ const u500=CATALOG.filter(p=>p.p<=500&&p.c!=='Home & Household').length; return `<div class="wrap"><h1 class="page-title">Special offers</h1><p class="page-sub">Real offers only. Launch promotions and discount codes will be set up in Shopify once the store goes live.</p><div class="offers">

function faq(){ const qs=[['What does HOBA mean?','House of Beauty Africa.'],['Where are you located?','Our flagship store is at Covo Square Mall, Kilimani (opposite Quickmart), 1st Floor, Suite 124, Nairobi. We also have offices in Paris, France and London, United Kingdom.'],['What is HOBA Health & Beauty?','We are a British–French company with our flagship store HOBA in Nairobi. Our retail and trade teams are based in Paris, London and Nairobi, which lets us trade across continents and coordinate with distributors, laboratories and health and safety teams in the USA, Europe and Africa. Our core emphasis is selecting highly effective skinceutical products suitable for women of colour.'],['Are your products authentic?','Yes. Every product is sourced directly from brands and authorised distributors in the UK, France, Switzerland, Korea and Australia.'],['How long does delivery take?','Order by 2pm for same-day dispatch. Kenya tracked delivery takes 1–2 business days in Nairobi and 2–4 business days elsewhere. Delivery is free on orders over KSh 5,000.'],['Do you deliver outside Kenya?','We deliver within East Africa: Kenya, Tanzania, Uganda and Rwanda. We are unable to sell to customers outside East Africa.'],['Can I return a product?','Yes. We offer a 14-day no-quibble guarantee. Return unopened products within 14 days of receipt for a refund of the product price. For hygiene reasons we cannot refund cosmetics that have been opened or used unless faulty.'],['How do I pay?','M-Pesa, Visa and Mastercard, PayPal, or Buy Goods till 4085648 when collecting in store.'],['Do you offer wholesale?','Yes. Minimum order value is KSh 20,000 with minimum quantities of usually 10 units. Email trade@houseofbeautyafrica.com or WhatsApp +44 (0)7539 892801.']];
  return `<div class="wrap narrow"><h1 class="page-title">Frequently asked questions</h1><p class="page-sub">Can't find an answer? Chat with HOBA Customer Care, Monday to Saturday 9am–8pm.</p><div class="faq">${qs.map(([q,a])=>`<details><summary>${q}</summary><div class="a">${a}</div></details>`).join('')}</div></div>`; }
function shipping(){ return `<div class="wrap narrow prose"><h1 class="page-title">Shipping &amp; returns</h1><h2>Shipping policy</h2><p>Order by 2pm for Kenya tracked delivery: 1–2 business days in Nairobi, 2–4 business days outside Nairobi. Delivery is free for all orders over KSh 5,000.</p><p>Orders are processed and shipped on business days only (Monday to Friday, excluding Kenyan public holidays). We aim to process orders within 48 hours, although this may take longer during sales and after public holidays.</p><div class="note">We deliver within East Africa only: Kenya, Tanzania, Uganda and Rwanda.</div><h2>Return &amp; exchange policy</h2><p>We want you to be happy with your order and offer a 14-day no-quibble guarantee on all products purchased through HOBA. If you are not totally satisfied or have simply changed your mind, return the unopened product(s) within 14 days of receipt and we will refund the price you paid. Original postage or courier charges are not refunded.</p><p>For faulty, damaged, unsatisfactory-quality or incorrect items, contact Customer Service by email or phone within 14 days of receiving your order. Please keep broken items, as we need photographic evidence to support any damage claim. Once provided, we will offer a full refund or replacement.</p><p>For hygiene and safety reasons we cannot refund or exchange grooming products or cosmetics that have been removed from the original wrapping or show signs of use, unless faulty.</p><h3>How to return</h3><ul><li>Request a returns form and label from Customer Service; it is emailed to your account address.</li><li>Print or hand-write the label, attach it to the parcel and include a copy inside with your Returns Number.</li><li>Pay standard courier charges and request a receipt. Email us a photo of the receipt and we refund the postage to your original payment method.</li><li>If you return a full order we can only refund up to the order value, so postage is credited to your account instead.</li></ul></div>`; }
function policy(tab){ return `<div class="wrap narrow prose"><h1 class="page-title">Store policy</h1>
  <h2>HOBA Customer Care (HCC)</h2><p>We're here for you and your skin every day of the week. Chat with us or give us a call and one of our in-store team members will be pleased to help. Customer Care is closed on 25–26 December and 1 January.</p><ul><li>Monday – Friday: 9:00am to 8:00pm</li><li>Saturday: 9:00am to 8:00pm</li><li>Call us: +254 (0)715 769814</li><li>Email: beauty@houseofbeauty.com</li></ul><p>We reply as soon as a team member is available, usually within an hour depending on in-store traffic. Our busiest hours are between 10am and 3pm.</p>
  <h2>HOBA Privacy &amp; Safety (HP&amp;S)</h2><p>This is the privacy notice of HOBA. "We", "our" or "us" refer to Health &amp; Beauty. We are committed to protecting your privacy and the confidentiality of your personal information. Our policy is not just an exercise in complying with the law, but a continuation of our respect for you and your personal information. We undertake to preserve the confidentiality of all information you provide to us, and hope that you reciprocate.</p>
  <h2 id="wholesale">HOBA Wholesale Inquiries (HWS)</h2><p>If you are a retailer and would like to represent the HOBA brand by selling our beauty products in your shop or online store, we would love to hear from you. We have a separate trade website with our full range, trade prices and minimum order quantities.</p><ul><li>Low minimum order value of KSh 20,000</li><li>Minimum order quantity is usually 10 (wonderfully low, we know)</li><li>Super-fast dispatch turnaround of 2–4 days</li><li>Exclusive show discounts</li></ul><p>Our dedicated trade sales team can advise on stock and support your business. WhatsApp/phone +44 (0)7539 892801 or email trade@houseofbeautyafrica.com.</p>
  <h2>Payment methods</h2><ul><li>M-Pesa</li><li>Credit / debit cards (Visa, Mastercard)</li><li>PayPal</li><li>Buy Goods till number 4085648 (in store)</li></ul></div>`; }
let giftAmt=1000;
function giftcard(){ const amts=[1000,2000,3000,5000,10000]; return `<div class="wrap"><div class="gift"><div class="giftcard"><div><span class="wm">HOBA</span><small>HOUSE OF BEAUTY AFRICA</small></div><div><span class="amt">${fmt(giftAmt)}</span><small>eGIFT CARD · REDEEM ONLINE OR IN STORE</small></div></div>
  <div><span class="eyebrow">Gifting</span><h1 class="page-title" style="margin-top:6px">HOBA eGift Card</h1><p class="page-sub">Delivered instantly by email with a personal message. Never expires. Redeemable online and at Covo Square Mall.</p><div class="field"><label>Amount</label></div><div class="amounts">${amts.map(a=>`<button class="${giftAmt===a?'on':''}" onclick="giftAmt=${a};render()">${fmt(a)}</button>`).join('')}<button class="${!amts.includes(giftAmt)?'on':''}" onclick="giftAmt=1500;render()">Other</button></div><form class="form" onsubmit="event.preventDefault();toast('Gift cards activate when the Shopify store launches')"><div class="two"><div class="field"><label for="g-to">Recipient name</label><input id="g-to"></div><div class="field"><label for="g-email">Recipient email</label><input id="g-email" type="email"></div></div><div class="field"><label for="g-msg">Message</label><textarea id="g-msg" rows="3" placeholder="Happy birthday!"></textarea></div><button class="btn btn-primary">Add to bag · ${fmt(giftAmt)}</button></form></div></div></div>`; }
function storePage(){ return `<div class="wrap"><div class="about-hero"><div><span class="eyebrow">Find our store</span><h1>Covo Square Mall, Kilimani</h1><p>${STORE.addr}. Opposite Quickmart. Parking available at the mall.</p><div class="delivery" style="margin:18px 0"><div>${I.shop}<span><b>Opening hours</b><br>${STORE.hours.join('<br>')}</span></div><div>${I.user}<span><b>Call or WhatsApp</b><br>${STORE.phone}</span></div><div>${I.check}<span><b>Email</b><br>${STORE.email}</span></div></div><a class="btn btn-primary" href="https://www.google.com/maps/search/Covo+Square+Mall+Kilimani+Nairobi" target="_blank" rel="noopener">Open in Google Maps</a></div><img src="content/one-destination.jpg" alt="Inside the HOBA store"></div>
  <section class="block"><div class="sec-head"><h2>In-store services</h2></div><div class="store"><div class="l"><h2>Beauty, in person</h2><p>Everything online is on the shelf in Kilimani too. Pop in to test textures, smell the mists and talk routines.</p></div><div class="r"><div><b>Click &amp; collect</b><span>Order online, collect the same day at the counter.</span></div><div><b>Skin consultations</b><span>Free 15-minute routine check.</span></div><div><b>Fragrance bar</b><span>Try every So...? Unique mist before you buy.</span></div><div><b>Trade counter</b><span>Wholesale orders from KSh 20,000.</span></div></div></div></section></div>`; }
function track(){ return `<div class="wrap narrow"><h1 class="page-title">Track an order</h1><p class="page-sub">Enter your order number (starts with HB) and the phone or email you used at checkout.</p><form class="track-box" onsubmit="event.preventDefault();document.getElementById('trk').hidden=false"><div class="field"><label for="t-no">Order number</label><input id="t-no" required placeholder="HB12345"></div><div class="field"><label for="t-ph">Phone or email</label><input id="t-ph" required></div><button class="btn btn-primary">Track</button><div id="trk" hidden><div class="steps"><div class="on"><i></i>Received</div><div class="on"><i></i>Packed</div><div><i></i>Out for delivery</div><div><i></i>Delivered</div></div><p style="font-size:13px;color:var(--muted);margin-top:10px">Example status. Live tracking connects to the courier after launch.</p></div></form></div>`; }
function contact(){ return `<div class="wrap narrow"><h1 class="page-title">Contact us</h1><p class="page-sub">HOBA Customer Care replies within the hour during opening times.</p><div class="delivery"><div>${I.user}<span><b>Call or WhatsApp</b><br>${STORE.phone} · +254 (0)715 769814</span></div><div>${I.check}<span><b>Email</b><br>${STORE.email} · beauty@houseofbeauty.com</span></div><div>${I.shop}<span><b>Visit</b><br>${STORE.addr}</span></div></div><form class="form" style="margin-top:24px" onsubmit="event.preventDefault();this.innerHTML='<p class=done style=\\'padding:20px 0;text-align:left\\'>Thanks — we will reply within the hour during opening times.</p>'"><div class="two"><div class="field"><label for="k-name">Name</label><input id="k-name" required></div><div class="field"><label for="k-email">Email</label><input id="k-email" type="email" required></div></div><div class="field"><label for="k-msg">How can we help?</label><textarea id="k-msg" rows="4" required></textarea></div><button class="btn btn-primary" style="justify-self:start">Send message</button></form></div>`; }

/* ---- render ---- */
function render(){
  const app=document.getElementById('app'); let body='';
  switch(view.name){
    case 'home': body=home(); break;
    case 'shop': case 'search': case 'brand': case 'new': body=plp(view); break;
    case 'product': body=pdp(view.params.id); break;
    case 'cart': body=cartPage(); break;
    case 'checkout': body=checkout(); break;
    case 'thanks': body=thanks(view); break;
    case 'account': body=account(); break;
    case 'wishlist': body=wishlist(); break;
    case 'brands': body=brands(); break;
    case 'offers': body=offers(); break;
    case 'about': body=about(); break;
    case 'faq': body=faq(); break;
    case 'shipping': body=shipping(); break;
    case 'policy': body=policy(view.params.tab); break;
    case 'giftcard': body=giftcard(); break;
    case 'store': body=storePage(); break;
    case 'track': body=track(); break;
    case 'contact': body=contact(); break;
    default: body=`<div class="wrap"><div class="empty">Page not found.</div></div>`;
  }
  app.innerHTML = header() + `<main id="main" style="padding-bottom:40px">${body}</main>` + footer();
  updateBadges();
  if(view.name==='policy' && view.params.tab==='wholesale'){ const el=document.getElementById('wholesale'); if(el) el.scrollIntoView(); }
}
function navFromHash(){ const h=(location.hash||'').slice(1); if(!h||h==='home') return; const c=catById(h); if(c) view={name:'shop',params:{cat:h}}; else if(['cart','account','about','faq','shipping','policy','giftcard','brands','offers','new','store','track','wishlist','contact'].includes(h)) view={name:h,params:{}}; }
function resetPlp(){ plpState={brands:[],price:[],avail:false,sort:'featured',shown:24,fq:''}; }
const _go=go; go=function(name,params,replace){ if(['shop','search','brand','new'].includes(name)) resetPlp(); _go(name,params,replace); };
navFromHash(); render();

</script>

</body>
